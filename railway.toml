# Railway: deploy from Dockerfile, keep the service always on for WebSockets.
# After first deploy, attach a Volume mounted at /data (see README).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
